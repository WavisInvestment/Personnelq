# Production stack: HTTPS proxy + website + API + database.
#   cp .env.production.example .env.production   (fill it in)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Full guide: DEPLOYMENT.md

name: personnelq

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    expose:
      - "3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-personnelq}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-personnelq}
      FRONTEND_URL: https://${DOMAIN}
      APP_URL: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-900s}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      FREE_ORGANIZATION_SEATS: ${FREE_ORGANIZATION_SEATS:-500}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-NGN}
      FULL_ASSESSMENT_PRICE: ${FULL_ASSESSMENT_PRICE:-}
      SUBSCRIPTION_PLANS: ${SUBSCRIPTION_PLANS:-}
      ASSESSMENT_PAYMENT_REQUIRED: ${ASSESSMENT_PAYMENT_REQUIRED:-false}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-}
      JOBS_INTERVAL_MS: ${JOBS_INTERVAL_MS:-}
      # Only used the first time, to create the first platform admin. Remove them afterwards.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personnelq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personnelq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # No published port: the database is reachable only from the API.

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
