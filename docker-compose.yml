version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: personnelq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personnelq_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personnelq_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: personnelq_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personnelq_network

volumes:
  postgres_data:
    driver: local

networks:
  personnelq_network:
    driver: bridge
