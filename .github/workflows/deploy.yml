name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Type-check
        run: |
          npx tsc --noEmit -p apps/api
          npx tsc --noEmit -p apps/web
      - name: Unit tests
        run: npx jest
        working-directory: apps/api

  # Runs only for a push to main, and only when the tests above passed.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Pull and rebuild on the server
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
          docker image prune -f
          REMOTE
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Check the site is up
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "https://${{ secrets.DEPLOY_DOMAIN }}/api/health" >/dev/null; then echo "healthy"; exit 0; fi
            echo "waiting ($i)"; sleep 10
          done
          echo "The site did not become healthy in 3 minutes. Check: docker compose logs api"; exit 1
